<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wiki vs RAG</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #E8DFD0;
    font-family: 'Inter', system-ui, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
  }
  .card {
    width: 1500px;
    height: 600px;
    background: #FAF5EC;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow:
      0 60px 120px -40px rgba(80, 55, 30, 0.30),
      0 1px 0 rgba(255,255,255,0.6) inset;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(140, 100, 60, 0.06) 1px, transparent 1px);
    background-size: 5px 5px;
    pointer-events: none;
    opacity: 0.9;
  }
  .card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg,
      rgba(255, 246, 230, 0.4) 0%,
      transparent 35%,
      transparent 65%,
      rgba(196, 168, 130, 0.10) 100%);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    z-index: 2;
  }
  .corner svg { display: block; }

  .top {
    position: absolute;
    top: 60px;
    left: 80px;
    right: 80px;
    z-index: 2;
  }
  .label {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8B6F47;
  }
  .label-muted {
    color: #6B5E52;
  }
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    color: #1C1714;
    font-size: 64px;
    line-height: 1.0;
    letter-spacing: -0.012em;
    margin-top: 14px;
  }
  .subhead {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #6B5E52;
    font-size: 22px;
    font-weight: 400;
    margin-top: 8px;
  }
  .bottom {
    position: absolute;
    bottom: 56px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    z-index: 2;
  }
  .stat {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    color: #1C1714;
    letter-spacing: -0.005em;
  }
  .credit {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    color: #6B5E52;
    text-transform: uppercase;
  }
  svg.canvas {
    position: absolute;
    top: 215px;
    left: 0;
    z-index: 1;
  }
  .col-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    fill: #8B6F47;
  }
  .col-label-muted { fill: #6B5E52; }
  .col-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    fill: #6B5E52;
  }
  .node-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    fill: #1C1714;
  }
  .node-label-strong { font-weight: 600; }
  .annot {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    fill: #6B5E52;
  }
  .annot-bronze {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    fill: #8B6F47;
    letter-spacing: 0.04em;
  }
  .divider {
    stroke: #D8CDB8;
    stroke-width: 1;
  }
  .link {
    stroke: #B89065;
    stroke-width: 1;
    fill: none;
    opacity: 0.55;
  }
  .link-faint {
    stroke: #B89065;
    stroke-width: 1;
    fill: none;
    opacity: 0.35;
    stroke-dasharray: 2 3;
  }
  .node {
    fill: #8B6F47;
  }
  .node-strong {
    fill: #8B6F47;
  }
  .cloud {
    fill: #A89B89;
  }
  .cloud-hit {
    fill: #8B6F47;
  }

  @media print {
    body { background: white; padding: 0; }
    .card { box-shadow: none; border-radius: 0; }
  }
</style>
</head>

  </svg>

  <!-- bottom -->
  <div class="bottom">
    <div class="stat">Five weeks. Five hundred pages. Zero embeddings.</div>
    <div class="credit">@StanMatuzik</div>
  </div>

</div>

</html>
